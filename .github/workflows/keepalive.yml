# Wakes the Render free-tier API and holds it warm.
#
# NOTE: GitHub's scheduled cron is best-effort and often delayed 30-120 min under
# load, so this alone can NOT keep the service awake 24/7. The reliable keep-alive
# is an external pinger (cron-job.org) hitting /api/health every 5 min — see README.
# This workflow is a backup and a manual "wake it now" button (Actions > Run workflow).
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the API (tolerating cold start) and hold it warm
        run: |
          URL="https://vedant-portfolio-api.onrender.com/api/health"

          wake() {
            # Cold start can take ~50-60s; retry up to ~2.5 min before giving up.
            for attempt in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo 000)
              echo "wake attempt $attempt -> HTTP $code"
              [ "$code" = "200" ] && return 0
              sleep 15
            done
            return 1
          }

          wake || { echo "::error::API never returned 200"; exit 1; }

          # Keep it warm across this run so a single firing covers ~8 min.
          for t in 4 8; do
            sleep 240
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo 000)
            echo "keep-warm +${t}m -> HTTP $code"
          done
